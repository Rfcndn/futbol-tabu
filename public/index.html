<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Arkadaşlarınla online kelime tahmin oyunu oyna! Yasaklı kelimelerden kaçın, takımına puan kazandır.">
  <title>Yasak Tabu 🤫 | Online Oyna</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=9">
</head>
<body>
  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Background Decoration -->
  <div class="bg-decoration">
    <div class="bg-circle bg-circle-1"></div>
    <div class="bg-circle bg-circle-2"></div>
    <div class="bg-circle bg-circle-3"></div>
  </div>

  <!-- ═══════════════ SCREEN: MENU ═══════════════ -->
  <section id="screen-menu" class="screen active">
    <div class="container menu-container">
      <div class="logo-section">
        <div class="logo-ball">🤫</div>
        <h1 class="brand-title">
          <span class="brand-futbol">YASAK</span>
          <span class="brand-tabu">TABU</span>
        </h1>
        <p class="brand-subtitle">Arkadaşlarınla Online Oyna</p>
      </div>

      <div class="menu-card glass-card">
        <div class="input-group">
          <label for="player-name">Oyuncu Adın</label>
          <input type="text" id="player-name" placeholder="Adınızı girin..." maxlength="20" autocomplete="off">
        </div>

        <button id="btn-create" class="btn btn-primary btn-lg">
          <span class="btn-icon">✨</span>
          <span>Oda Oluştur</span>
        </button>

        <div class="divider-line">
          <span>veya</span>
        </div>

        <div class="input-group">
          <label for="room-code-input">Oda Kodu</label>
          <input type="text" id="room-code-input" placeholder="Ör: ABC123" maxlength="6" autocomplete="off" style="text-transform: uppercase;">
        </div>

        <button id="btn-join" class="btn btn-secondary btn-lg">
          <span class="btn-icon">🎯</span>
          <span>Odaya Katıl</span>
        </button>
      </div>

      <p class="footer-text">Sesli iletişim için Discord veya WhatsApp kullanın 🎙️</p>
    </div>
  </section>

  <!-- ═══════════════ SCREEN: CUSTOM MODE ═══════════════ -->
  <section id="screen-custom" class="screen">
    <div class="container create-container">
      <div class="create-header">
        <button id="btn-custom-back" class="nav-back-btn" aria-label="Geri">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="create-header-text">
          <h1 class="create-title">Özel Kartlar</h1>
          <p class="create-subtitle">Kendi tabu kartlarınızı oluşturun.</p>
        </div>
      </div>

      <div id="custom-cards-list" class="custom-cards-list"></div>

      <button id="btn-add-card" class="add-card-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Yeni Kart Ekle
      </button>

      <div class="create-footer">
        <button id="btn-custom-save" class="continue-btn" disabled>
          Kaydet
        </button>
      </div>
    </div>
  </section>

  <!-- ═══════════════ SCREEN: LOBBY ═══════════════ -->
  <section id="screen-lobby" class="screen">
    <div class="container lobby-container">
      <div class="lobby-header" style="position: relative;">
        <div style="position: absolute; left: 0; top: 0; display: flex; gap: 8px;">
          <button id="btn-lobby-back" class="nav-back-btn" aria-label="Geri" style="margin: 0;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <button id="btn-lobby-home" class="nav-back-btn" aria-label="Ana Sayfa" style="margin: 0;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          </button>
        </div>
        <h2 style="padding-top: 4px;">Oyun Lobisi</h2>
        <div class="room-code-badge glass-card">
          <span class="room-code-label">Oda Kodu</span>
          <span class="room-code-value" id="lobby-room-code">------</span>
          <div style="display:flex; gap: 8px; margin-left: 8px;">
            <button class="btn-icon-only" id="btn-copy-code-only" title="Kodu kopyala">📋</button>
            <button class="btn-icon-only" id="btn-copy-link" title="Davet linkini kopyala">🔗</button>
          </div>
        </div>
      </div>

      <!-- Category Picker for Lobby -->
      <div id="lobby-category-section" class="glass-card" style="margin-bottom: 24px;">
        <h3 style="margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;">
          Kategori Seçimi
          <span id="category-host-badge" style="font-size: 11px; padding: 4px 8px; background: rgba(255,255,255,0.1); border-radius: 12px; font-weight: normal; color: #a0a5af; display: none;">Sadece Kurucu</span>
        </h3>
        <div class="cat-grid" id="lobby-cat-grid">
          <button class="cat-card selected" data-category="football">
            <span class="cat-icon" style="--cat-color: #10b981;">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m12 16 3.5-2.5v-3L12 8l-3.5 2.5v3Z"/><path d="M12 8V2"/><path d="m15.5 10.5 4.5-2"/><path d="m15.5 13.5 3.5 4.5"/><path d="m8.5 10.5-4.5-2"/><path d="m8.5 13.5-3.5 4.5"/><path d="M12 16v6"/></svg>
            </span>
            <span class="cat-label">Futbol</span>
            <span class="cat-check"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          </button>
          <button class="cat-card" data-category="movies">
            <span class="cat-icon" style="--cat-color: #e11d48;">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/><line x1="17" y1="17" x2="22" y2="17"/></svg>
            </span>
            <span class="cat-label">Film & Dizi</span>
            <span class="cat-check"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          </button>
          <button class="cat-card" data-category="music">
            <span class="cat-icon" style="--cat-color: #8b5cf6;">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            </span>
            <span class="cat-label">Müzik</span>

          </button>
          <button class="cat-card" data-category="geography">

              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            </span>
            <span class="cat-label">Coğrafya</span>
            <span class="cat-check"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          </button>
          <button class="cat-card" data-category="general">
            <span class="cat-icon" style="--cat-color: #f59e0b;">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            </span>
            <span class="cat-label">Gen. Kültür</span>
            <span class="cat-check"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          </button>
          <button class="cat-card" data-category="gaming">
            <span class="cat-icon" style="--cat-color: #06b6d4;">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/><rect x="2" y="6" width="20" height="12" rx="2"/></svg>
            </span>
            <span class="cat-label">Oyunlar</span>
            <span class="cat-check"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          </button>
          <button class="cat-card" data-category="science">
            <span class="cat-icon" style="--cat-color: #84cc16;">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/></svg>
            </span>
            <span class="cat-label">Bilim</span>
            <span class="cat-check"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          </button>
          <button class="cat-card" data-category="history">
            <span class="cat-icon" style="--cat-color: #b45309;">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/></svg>
            </span>
            <span class="cat-label">Tarih</span>
            <span class="cat-check"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          </button>
          <button class="cat-card" data-category="custom">
            <span class="cat-icon" style="--cat-color: #94a3b8;">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            </span>
            <span class="cat-label">Özel Mod</span>
            <span class="cat-check"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          </button>
        </div>

        <div class="cat-grid" id="gaming-cat-grid" style="display: none;">
          <button class="cat-card" data-category="gaming_supercell">
            <span class="cat-icon" style="--cat-color: #3b82f6;">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14"/>
              </svg>
            </span>
            <span class="cat-label">Supercell</span>
            <span class="cat-check"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          </button>
          <button class="cat-card" data-category="gaming_minecraft">
            <span class="cat-icon" style="--cat-color: #22c55e;">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/></svg>
            </span>
            <span class="cat-label">Minecraft</span>
            <span class="cat-check"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          </button>
          <button class="cat-card" data-category="gaming_nintendo">
            <span class="cat-icon" style="--cat-color: #ef4444;">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="6"/><circle cx="17" cy="12" r="1.5"/><circle cx="13" cy="12" r="1.5"/><path d="M7 10v4"/><path d="M5 12h4"/></svg>
            </span>
            <span class="cat-label">Nintendo</span>
            <span class="cat-check"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          </button>
          <button class="cat-card" data-category="gaming_yetkinbaba">
            <span class="cat-icon" style="--cat-color: #a855f7;">
              <img src="/img/yetkinbaba.png" alt="YetkinBaba" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: white;" onerror="this.src='data:image/svg+xml;utf8,<svg width=\'28\' height=\'28\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%23a855f7\' stroke-width=\'1.8\' stroke-linecap=\'round\' stroke-linejoin=\'round\' xmlns=\'http://www.w3.org/2000/svg\'><path d=\'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2\'/><circle cx=\'12\' cy=\'7\' r=\'4\'/></svg>'">
            </span>
            <span class="cat-label">YetkinBaba</span>
            <span class="cat-check"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          </button>
          <button class="cat-card" data-category="gaming_karisik">
            <span class="cat-icon" style="--cat-color: #f43f5e;">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
            </span>
            <span class="cat-label">Karışık</span>
            <span class="cat-check"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          </button>
          <button class="cat-card" id="btn-gaming-back" style="background: rgba(255, 255, 255, 0.05);">
            <span class="cat-icon" style="--cat-color: #94a3b8;">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </span>
            <span class="cat-label">Geri Dön</span>
          </button>
        </div>

        <div class="cat-grid" id="movies-cat-grid" style="display: none;">
          <button class="cat-card" data-category="movies_filmler">
            <span class="cat-icon" style="--cat-color: #e11d48;">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/><line x1="17" y1="17" x2="22" y2="17"/></svg>
            </span>
            <span class="cat-label">Filmler</span>
            <span class="cat-check"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          </button>
          <button class="cat-card" data-category="movies_diziler">
            <span class="cat-icon" style="--cat-color: #8b5cf6;">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>
            </span>
            <span class="cat-label">Diziler</span>
            <span class="cat-check"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          </button>
          <button class="cat-card" data-category="movies_karakterler">
            <span class="cat-icon" style="--cat-color: #10b981;">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <span class="cat-label">Karakterler</span>
            <span class="cat-check"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          </button>
          <button class="cat-card" data-category="movies_karisik">
            <span class="cat-icon" style="--cat-color: #f43f5e;">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
            </span>
            <span class="cat-label">Karışık</span>
            <span class="cat-check"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          </button>
          <button class="cat-card" id="btn-movies-back" style="background: rgba(255, 255, 255, 0.05);">
            <span class="cat-icon" style="--cat-color: #94a3b8;">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </span>
            <span class="cat-label">Geri Dön</span>
          </button>
        </div>
      </div>

      <div class="teams-row">
        <!-- Team A -->
        <div class="team-card glass-card team-card-a">
          <div class="team-header">
            <input type="text" class="team-name-input" id="team-a-name-input" value="Takım A" maxlength="15">
            <span class="team-score" id="team-a-score-lobby">0</span>
          </div>
          <div class="team-players-list" id="team-a-players"></div>
          <button class="btn btn-team btn-team-a" data-team="A">
            <span>⬅ Katıl</span>
          </button>
        </div>

        <div class="vs-badge">VS</div>

        <!-- Team B -->
        <div class="team-card glass-card team-card-b">
          <div class="team-header">
            <input type="text" class="team-name-input" id="team-b-name-input" value="Takım B" maxlength="15">
            <span class="team-score" id="team-b-score-lobby">0</span>
          </div>
          <div class="team-players-list" id="team-b-players"></div>
          <button class="btn btn-team btn-team-b" data-team="B">
            <span>Katıl ➡</span>
          </button>
        </div>
      </div>

      <!-- Unassigned Players -->
      <div class="unassigned-section glass-card" id="unassigned-section" style="display:none;">
        <h3>🪑 Takımsız Oyuncular</h3>
        <div id="unassigned-players"></div>
      </div>

      <!-- Settings -->
      <div class="settings-card glass-card" id="settings-card">
        <h3>⚙️ Ayarlar</h3>
        <div class="settings-grid">
          <div class="setting-item">
            <label for="setting-round-time">Anlatma Süresi</label>
            <select id="setting-round-time">
              <option value="30">30 sn</option>
              <option value="60" selected>60 sn</option>
              <option value="90">90 sn</option>
              <option value="120">120 sn</option>
            </select>
          </div>
          <div class="setting-item">
            <label for="setting-target-score">Hedef Skor</label>
            <select id="setting-target-score">
              <option value="5">5 puan</option>
              <option value="10" selected>10 puan</option>
              <option value="15">15 puan</option>
              <option value="20">20 puan</option>
            </select>
          </div>
        </div>
      </div>

      <button id="btn-start-game" class="btn btn-start btn-lg" style="display:none;">
        🚀 Oyunu Başlat
      </button>

      <p class="lobby-hint" id="lobby-hint">Her takımda en az 2 oyuncu olmalı.</p>
    </div>
  </section>

  <!-- ═══════════════ SCREEN: TABOO PICK ═══════════════ -->
  <section id="screen-taboo-pick" class="screen">
    <div class="container game-container" id="taboo-pick-content"></div>
  </section>

  <!-- ═══════════════ SCREEN: DESCRIBE ═══════════════ -->
  <section id="screen-describe" class="screen">
    <div class="container game-container" id="describe-content"></div>
  </section>

  <!-- ═══════════════ SCREEN: ROUND END ═══════════════ -->
  <section id="screen-round-end" class="screen">
    <div class="container game-container" id="round-end-content"></div>
  </section>

  <!-- ═══════════════ SCREEN: GAME OVER ═══════════════ -->
  <section id="screen-game-over" class="screen">
    <div class="container game-container" id="game-over-content"></div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js?v=8"></script>
</body>
</html>
